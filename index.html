<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kavya &amp; Sanjay | Wedding Invitation</title>
    <meta name="description" content="Join us for the wedding celebration of Kavya and Sanjay." />
    <link rel="canonical" href="https://kavyasanjay.com/" />
    <link rel="image_src" href="https://kavyasanjay.com/og.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Kavya &amp; Sanjay Wedding" />
    <meta property="og:description" content="You are invited to celebrate with us." />
    <meta property="og:site_name" content="Kavya &amp; Sanjay" />
    <meta property="og:image" itemprop="image" content="https://kavyasanjay.com/og.jpg" />
    <meta property="og:image:secure_url" content="https://kavyasanjay.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="315" />
    <meta property="og:image:alt" content="Wedding invitation for Kavya and Sanjay" />
    <meta property="og:url" content="https://kavyasanjay.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kavyasanjay.com/og.jpg" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Serif+Kannada:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=17" />
  </head>
  <body>
    <audio id="bgMusic" preload="none" playsinline hidden>
      <source src="" type="audio/mpeg" />
    </audio>
    <div id="youtubeMusicHost" class="youtube-music-host" aria-hidden="true">
      <div id="youtubeMusicPlayer"></div>
    </div>

    <header class="top-nav">
      <span class="brand-mark" id="brandMark">K & S</span>
      <nav id="quickNav" aria-label="Sections"></nav>
      <div class="lang-wrap">
        <select id="langSelect" aria-label="Select language"></select>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">◐</button>
    </header>

    <main>
      <section id="invitation" class="invite-section fade-in visible">
        <div class="invite-card-wrap" id="inviteCardWrap">
          <img
            id="invitationImage"
            alt="Wedding invitation card for Kavya and Sanjay"
            loading="eager"
          />
        </div>
        <div class="invite-template-wrap" id="inviteTemplateWrap">
          <video
            id="introTemplateVideo"
            class="invite-template-video"
            autoplay
            muted
            playsinline
            preload="auto"
            controls
            aria-label="Wedding invitation video for Kavya and Sanjay"
          ></video>
        </div>
      </section>

      <section id="couple-photo" class="couple-photo-section section fade-in">
        <div class="couple-photo-frame">
          <div class="invite-cinematic" id="coupleCinematic">
            <div class="invite-generate" id="coupleGenerate" aria-hidden="true">
              <div class="invite-generate-scan"></div>
              <div class="invite-generate-bars">
                <span></span><span></span><span></span>
              </div>
              <p class="invite-generate-label" data-i18n="creatingMoment">Creating your moment…</p>
            </div>
            <div class="invite-frame" id="coupleFrame">
              <img id="couplePhotoImage" alt="Kavya and Sanjay" loading="eager" />
              <div class="invite-shimmer" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="couple-photo-caption">
          <p id="guestGreeting" class="guest-greeting"></p>
          <h1 id="coupleNames"></h1>
          <p id="weddingHashtag" class="hashtag"></p>
          <p class="hero-date" id="heroDate"></p>
          <div class="countdown" id="countdown" aria-live="polite"></div>
          <div class="hero-cta">
            <a href="#events" class="btn btn-primary" data-i18n="viewEvents">View Events</a>
            <a href="#rsvp" class="btn btn-secondary" data-i18n="rsvpNow">RSVP Now</a>
          </div>
        </div>
      </section>

      <section id="events" class="section fade-in">
        <span class="section-kicker" data-i18n="eventsKicker">Celebrations</span>
        <h2 data-i18n="events">EVENTS</h2>
        <div class="section-divider"></div>
        <div class="events-toolbar">
          <button type="button" id="addAllCalendarBtn" class="btn btn-outline btn-sm"></button>
        </div>
        <div id="eventsGrid" class="events-grid"></div>
      </section>

      <section id="venue" class="section fade-in">
        <span class="section-kicker" data-i18n="venueKicker">Location</span>
        <h2 data-i18n="venue">Venue</h2>
        <div class="section-divider"></div>
        <div class="locations-grid">
          <div class="location-block">
            <article class="card">
              <h3 id="venueName"></h3>
              <p class="venue-hall" id="venueHall"></p>
              <p id="venueAddress"></p>
              <p id="venueParking"></p>
              <ul class="venue-tips" id="venueTips"></ul>
              <a
                id="templeMapLink"
                class="btn btn-primary btn-sm"
                target="_blank"
                rel="noreferrer"
                data-i18n="directions"
                >Directions</a>
            </article>
            <iframe
              id="templeMap"
              class="location-map"
              title="Bharatiya Temple map"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </div>
      </section>

      <section id="rsvp" class="fade-in">
        <div class="section-inner">
          <span class="section-kicker" data-i18n="rsvpKicker">Join Us</span>
          <h2 data-i18n="rsvp">RSVP</h2>
          <div class="section-divider"></div>
          <p id="rsvpDeadline" class="rsvp-deadline"></p>
          <p id="rsvpFormNote" class="rsvp-form-note hidden" data-i18n="rsvpFormNote"></p>
          <div id="googleFormContainer" class="google-form-container card hidden">
            <div id="rsvpFormHeader" class="rsvp-form-header">
              <h3 id="rsvpCoupleNames"></h3>
            </div>
            <div class="google-form-embed-wrap">
              <iframe
                id="googleFormEmbed"
                title="RSVP form"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
              ></iframe>
            </div>
          </div>
          <p id="rsvpSetupNote" class="rsvp-setup-note hidden"></p>
          <a
            id="googleFormOpenLink"
            class="btn btn-outline google-form-open hidden"
            target="_blank"
            rel="noreferrer"
            data-i18n="openRsvpForm"
            >Open RSVP form</a
          >
        </div>
      </section>

      <section id="livestream" class="section fade-in">
        <span class="section-kicker" data-i18n="livestreamKicker">Wedding Day</span>
        <h2 data-i18n="livestreamTitle">Livestream</h2>
        <div class="section-divider"></div>
        <div id="livestreamCard" class="card livestream-card"></div>
      </section>

      <section id="travel" class="section fade-in">
        <span class="section-kicker" data-i18n="travelKicker">For Guests</span>
        <h2 data-i18n="travelStay">Travel & Stay</h2>
        <div class="section-divider"></div>
        <div id="travelGrid" class="card-grid"></div>
      </section>

      <section id="contact" class="section fade-in">
        <span class="section-kicker" data-i18n="contactKicker">Help</span>
        <h2 data-i18n="contactHelp">Contact</h2>
        <div class="section-divider"></div>
        <div id="contactGrid" class="card-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p id="footerText">Kavya & Sanjay · With love <span class="footer-love" aria-hidden="true">♥</span></p>
    </footer>

    <nav class="mobile-bar" aria-label="Quick actions">
      <a href="#events" data-i18n="viewEvents">Events</a>
      <a href="#rsvp" class="primary" data-i18n="rsvpNow">RSVP</a>
    </nav>

    <a id="whatsAppFloat" class="whatsapp-float" target="_blank" rel="noreferrer" aria-label="Chat on WhatsApp"></a>

    <dialog id="lightbox">
      <button id="closeLightbox" class="icon-btn" type="button" aria-label="Close">×</button>
      <img id="lightboxImage" alt="Gallery preview" />
    </dialog>

    <script src="data/config.js?v=30"></script>
    <script src="app.js?v=32"></script>
  </body>
</html>
